name: Release

# Builds AionPingMeter.exe and publishes a release
# when a version tag (e.g. v1.1.0) is pushed or created from the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        shell: pwsh
        run: |
          # The exe's version comes from the tag.
          $version = "${{ github.ref_name }}".TrimStart("v")
          $toml = Get-Content Cargo.toml -Raw
          $toml = ([regex]'(?m)^version = ".*?"').Replace($toml, "version = `"$version`"", 1)   # first match = [package]
          Set-Content Cargo.toml $toml -NoNewline
          cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/AionPingMeter.exe, README.md, LICENSE out
          $zip = "AionPingMeter-$tag.zip"
          Compress-Archive -Path "out/*" -DestinationPath $zip
          $mb = (Get-Item $zip).Length / 1MB
          $size = [string]::Format([cultureinfo]::InvariantCulture, "{0:0.0} MB", $mb)
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Out-File -Encoding ascii SHA256SUMS.txt

          # Release notes: download guide in three languages + this version's CHANGELOG section
          $changelog = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($tag))\s*\r?\n(.*?)(?=^## |\z)")
          $changes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See [CHANGELOG.md](CHANGELOG.md)." }
          (Get-Content .github/RELEASE_NOTES.md -Raw).
            Replace("{{TAG}}", $tag).
            Replace("{{SIZE}}", $size).
            Replace("{{CHANGES}}", $changes) | Out-File -Encoding utf8 release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: AionPingMeter ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            AionPingMeter-${{ github.ref_name }}.zip
            SHA256SUMS.txt
